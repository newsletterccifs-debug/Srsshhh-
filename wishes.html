<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Wishbook 💌 Digital Guestbook & Pinboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-noir-gold">

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <span class="brand-icon">⚜️</span>
      <span>Shristii's Gala</span>
    </a>

    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="memories.html" class="nav-link">Memories</a></li>
      <li><a href="arcade.html" class="nav-link">Arcade</a></li>
      <li><a href="wishes.html" class="nav-link active">Wishbook</a></li>
      <li><a href="surprise.html" class="nav-link">Secret Vault</a></li>
    </ul>

    <div class="nav-controls">
      <button class="control-btn" id="bgm-toggle-btn">🎵 Melody: OFF</button>
      <button class="control-btn" id="sfx-toggle-btn">🔊 Sound: ON</button>
      <select id="theme-select" class="theme-picker">
        <option value="theme-noir-gold">⚜️ Noir & Champagne</option>
        <option value="theme-velvet-wine">🍷 Velvet & Rose Gold</option>
        <option value="theme-emerald-luxe">🌲 Emerald & Gold</option>
        <option value="theme-ivory-champagne">🥂 Alabaster & Gold</option>
      </select>
    </div>
  </nav>

  <div class="pinboard-container">
    <div class="hero-section" style="padding-bottom: 1.5rem;">
      <div class="hero-badge">💌 The Living Guestbook 💌</div>
      <h1 class="hero-title">Birthday Wishes Pinboard</h1>
      <p class="hero-subtitle">
        Leave a sweet note, inside joke, or blessing for <span data-bind="name">Shristii 🐘</span> to cherish forever!
      </p>

      <div class="btn-group justify-center mt-3">
        <button id="open-wish-modal-btn" class="btn-primary">✍️ Pin Your Wish</button>
        <button id="export-wishes-btn" class="btn-secondary">🖨️ Export Keepsake</button>
      </div>
    </div>

    <!-- Live Sticky Notes Pinboard Grid -->
    <div class="pinboard-grid" id="wishes-board">
      <!-- Injected by main.js -->
    </div>
  </div>

  <!-- ADD WISH MODAL -->
  <div id="add-wish-modal" class="modal-backdrop hidden">
    <div class="modal-overlay"></div>
    <div class="modal-card glass-panel fade-in" style="max-width: 500px; text-align: left;">
      <span class="modal-close-btn" id="close-wish-modal">✖</span>
      <h2 style="margin-bottom: 0.5rem;">📌 Pin a Birthday Wish</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Your message will be pinned to the board!</p>

      <form id="new-wish-form">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-weight: 700; margin-bottom: 0.3rem;">Your Name / Nickname</label>
          <input type="text" id="wish-author" required placeholder="e.g. Maya or The Bestie" style="width: 100%; padding: 0.7rem; border-radius: 10px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-main);" />
        </div>

        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
          <div style="flex: 1;">
            <label style="display: block; font-weight: 700; margin-bottom: 0.3rem;">Avatar Emoji</label>
            <select id="wish-avatar" style="width: 100%; padding: 0.7rem; border-radius: 10px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-main);">
              <option value="🎉">🎉 Party Poppers</option>
              <option value="💖">💖 Sparkling Heart</option>
              <option value="⭐">⭐ Golden Star</option>
              <option value="🚀">🚀 Rocket</option>
              <option value="🎂">🎂 Birthday Cake</option>
              <option value="🥂">🥂 Cheers</option>
              <option value="👑">👑 Royalty</option>
            </select>
          </div>

          <div style="flex: 1;">
            <label style="display: block; font-weight: 700; margin-bottom: 0.3rem;">Relationship Badge</label>
            <select id="wish-badge" style="width: 100%; padding: 0.7rem; border-radius: 10px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-main);">
              <option value="Bestie">Bestie</option>
              <option value="Family">Family</option>
              <option value="Crew">Crew</option>
              <option value="Partner in Crime">Partner in Crime</option>
              <option value="Fan Club">Fan Club</option>
            </select>
          </div>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-weight: 700; margin-bottom: 0.3rem;">Note Card Color</label>
          <div style="display: flex; gap: 1rem;">
            <label style="cursor: pointer;"><input type="radio" name="card-color" value="card-yellow" checked /> 🟡 Yellow</label>
            <label style="cursor: pointer;"><input type="radio" name="card-color" value="card-pink" /> 🌸 Pink</label>
            <label style="cursor: pointer;"><input type="radio" name="card-color" value="card-blue" /> 🔵 Blue</label>
            <label style="cursor: pointer;"><input type="radio" name="card-color" value="card-green" /> 🟢 Mint</label>
          </div>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-weight: 700; margin-bottom: 0.3rem;">Your Birthday Message</label>
          <textarea id="wish-text" required rows="4" placeholder="Write something sweet, hilarious, or unforgettable..." style="width: 100%; padding: 0.7rem; border-radius: 10px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-main); font-family: inherit;"></textarea>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">📌 Post Wish to Board</button>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="content.js"></script>
  <script src="audio.js"></script>
  <script src="confetti.js"></script>
  <script src="main.js"></script>
</body>
</html>
